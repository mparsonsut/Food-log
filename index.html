<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Food Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Food Log</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box} body{margin:0;background:#f5f5f7;color:#111}
header{position:sticky;top:0;background:rgba(255,255,255,.96);padding:15px 18px;border-bottom:1px solid #ddd;z-index:10}
h1{margin:0;font-size:28px} main{padding:14px;max-width:760px;margin:0 auto 86px}
.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{background:#f2f2f5;border-radius:11px;padding:10px;text-align:center} .metric b{display:block;font-size:22px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #eee}
.row:first-child{border-top:0} .muted{color:#666;font-size:13px} .empty{color:#777;font-style:italic}
button{font:inherit;border:0;border-radius:10px;padding:9px 12px;background:#0a84ff;color:#fff}
.secondary{background:#e9e9ed;color:#111} .danger{background:#ff3b30}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(255,255,255,.97);border-top:1px solid #ddd;padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:20}
.tabs button{flex:1;background:transparent;color:#555;padding:8px 3px} .tabs button.active{color:#0a84ff;font-weight:700}
input,select{width:100%;font:inherit;padding:11px;border:1px solid #ccc;border-radius:10px;background:#fff}
label{display:block;font-weight:600;margin:11px 0 5px} dialog{border:0;border-radius:16px;padding:0;width:min(94vw,520px)}
dialog::backdrop{background:rgba(0,0,0,.35)} form{padding:18px} .actions{display:flex;gap:8px;margin-top:16px} .actions button{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px} .chip{background:#f0f0f3;border-radius:999px;padding:6px 9px;font-size:13px}
.search{margin-bottom:12px} .section-title{display:flex;justify-content:space-between;align-items:center} .section-title h2{margin:0;font-size:20px}
.smallbtn{padding:7px 9px;font-size:13px}
</style>
</head>
<body>
<header><h1 id="pageTitle">Food Log</h1></header>
<main id="app"></main>
<nav class="tabs">
<button data-tab="today" class="active">Today</button>
<button data-tab="foods">Foods</button>
</nav>

<dialog id="foodDialog">
<form method="dialog" id="foodForm">
<h2 id="dialogTitle" style="margin-top:0">Add Food</h2>
<label>Meal</label><select id="meal"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select>
<label>Food</label><input id="foodName" list="foodList" autocomplete="off" required><datalist id="foodList"></datalist>
<label>Quantity</label><input id="quantity" value="1">
<label>Unit</label><select id="unit"><option>cup</option><option>tbsp</option><option>tsp</option><option>oz</option><option>lb</option><option>gram</option><option>slice</option><option>piece</option><option>serving</option><option>bowl</option><option>glass</option><option>small</option><option>medium</option><option>large</option></select>
<label>Category</label><select id="category"><option>Protein</option><option>Fruit / Vegetable</option><option>Carb / Starch</option><option>Dairy</option><option>Fat</option><option>Sugar / Sweets</option><option>Beverage</option><option>Other</option></select>
<div class="actions"><button value="cancel" class="secondary">Cancel</button><button id="saveFood">Save</button></div>
</form>
</dialog>

const MEALS=["Breakfast","Lunch","Dinner","Snack"];
const DBNAME="FoodLogDB"; const DBVER=1; let db; let tab="today";
function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function openDB(){
 db=await new Promise((res,rej)=>{const r=indexedDB.open(DBNAME,DBVER);
 r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("entries"))d.createObjectStore("entries",{keyPath:"id"});if(!d.objectStoreNames.contains("foods"))d.createObjectStore("foods",{keyPath:"name"})};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
 const foods=await all("foods"); if(!foods.length){const tx=db.transaction("foods","readwrite"); const st=tx.objectStore("foods"); CATALOG.forEach(f=>st.put(f)); await new Promise(r=>tx.oncomplete=r);}
}
function store(n,m="readonly"){return db.transaction(n,m).objectStore(n)} async function all(n){return req(store(n).getAll())}
async function put(n,o){return req(store(n,"readwrite").put(o))} async function del(n,k){return req(store(n,"readwrite").delete(k))}
function day(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
async function render(){
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
 document.getElementById("pageTitle").textContent=tab==="today"?"Food Log":"Foods";
 if(tab==="today") await renderToday(); else await renderFoods();
}
async function renderToday(){
 const entries=(await all("entries")).filter(e=>e.date===day()); const foods=await all("foods");
 const main=["Breakfast","Lunch","Dinner"].filter(m=>entries.some(e=>e.meal===m)).length;
 const counts={};entries.forEach(e=>counts[e.category]=(counts[e.category]||0)+1);
 let h=`<section class="card"><div class="section-title"><h2>Today Summary</h2><button id="topAdd">Add Food</button></div>
 <div class="summary"><div class="metric"><b>${main}/3</b>Main Meals</div><div class="metric"><b>${entries.length}</b>Food Entries</div><div class="metric"><b>${entries.filter(e=>e.meal==="Snack").length}</b>Snacks</div></div>
 <div class="chips">${Object.keys(counts).sort().map(c=>`<span class="chip">${esc(c)}: ${counts[c]}</span>`).join("")}</div></section>`;
 const recent=[...entries].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).filter((e,i,a)=>a.findIndex(x=>x.foodName===e.foodName)===i).slice(0,5);
 if(recent.length)h+=`<section class="card"><h2 style="margin-top:0;font-size:20px">Recent Foods</h2>${recent.map(e=>`<button class="secondary smallbtn recent" data-food="${esc(e.foodName)}">${esc(e.foodName)}</button> `).join("")}</section>`;
 for(const meal of MEALS){const es=entries.filter(e=>e.meal===meal);h+=`<section class="card"><div class="section-title"><h2>${meal}</h2><button class="secondary smallbtn addMeal" data-meal="${meal}">Add</button></div>${es.length?es.map(e=>`<div class="row"><div><b>${esc(e.foodName)}</b><div class="muted">${esc(e.quantity)} ${esc(e.unit)} · ${esc(e.category)}</div></div><button class="danger smallbtn deleteEntry" data-id="${e.id}">Delete</button></div>`).join(""):'<div class="empty">No entries</div>'}</section>`}
 document.getElementById("app").innerHTML=h;
 document.getElementById("topAdd").onclick=()=>openFood();
 document.querySelectorAll(".addMeal").forEach(b=>b.onclick=()=>openFood(b.dataset.meal));
 document.querySelectorAll(".deleteEntry").forEach(b=>b.onclick=async()=>{await del("entries",b.dataset.id);render()});
 document.querySelectorAll(".recent").forEach(b=>b.onclick=()=>openFood("Breakfast",b.dataset.food));
}
async function renderFoods(){
 const foods=(await all("foods")).sort((a,b)=>a.name.localeCompare(b.name));
 document.getElementById("app").innerHTML=`<input class="search" id="foodSearch" placeholder="Search foods or categories"><section class="card"><div class="section-title"><h2>Saved Foods</h2><span class="muted">${foods.length} foods</span></div><div id="foodRows"></div></section>`;
 const draw=(q="")=>{q=q.toLowerCase();const f=foods.filter(x=>x.name.toLowerCase().includes(q)||x.category.toLowerCase().includes(q));document.getElementById("foodRows").innerHTML=f.map(x=>`<div class="row"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.quantity)} ${esc(x.unit)} · ${esc(x.category)}</div></div><button class="secondary smallbtn logSaved" data-food="${esc(x.name)}">Log</button></div>`).join("")||'<div class="empty">No matching foods</div>';document.querySelectorAll(".logSaved").forEach(b=>b.onclick=()=>openFood("Breakfast",b.dataset.food))};
 draw();document.getElementById("foodSearch").oninput=e=>draw(e.target.value);
}
async function openFood(meal="Breakfast",name=""){
 document.getElementById("meal").value=meal;document.getElementById("foodName").value=name;
 const foods=await all("foods");document.getElementById("foodList").innerHTML=foods.map(f=>`<option value="${esc(f.name)}"></option>`).join("");
 const f=foods.find(x=>x.name===name);document.getElementById("quantity").value=f?f.quantity:"1";document.getElementById("unit").value=f?f.unit:"cup";document.getElementById("category").value=f?f.category:"Other";document.getElementById("foodDialog").showModal();
}
document.getElementById("foodName").oninput=async e=>{const foods=await all("foods");const f=foods.find(x=>x.name.toLowerCase()===e.target.value.trim().toLowerCase());if(f){quantity.value=f.quantity;unit.value=f.unit;category.value=f.category}};
document.getElementById("saveFood").onclick=async e=>{const n=document.getElementById("foodName").value.trim();if(!n){e.preventDefault();return};const obj={id:crypto.randomUUID(),date:day(),meal:meal.value,foodName:n,quantity:quantity.value.trim()||"1",unit:unit.value,category:category.value,createdAt:new Date().toISOString()};await put("entries",obj);const foods=await all("foods");if(!foods.some(f=>f.name.toLowerCase()===n.toLowerCase()))await put("foods",{name:n,quantity:obj.quantity,unit:obj.unit,category:obj.category});setTimeout(render,0)};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
openDB().then(render);
if("serviceWorker"in navigator)navigator.serviceWorker.register("service-worker.js");
</script>
</body></html>
