<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Food Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Food Log</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#f5f5f7;color:#111}
header{position:sticky;top:0;background:rgba(255,255,255,.97);padding:15px 18px;border-bottom:1px solid #ddd;z-index:10}
h1{margin:0;font-size:28px}
main{padding:14px;max-width:760px;margin:0 auto 92px}
.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{background:#f2f2f5;border-radius:11px;padding:10px;text-align:center}
.metric b{display:block;font-size:22px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #eee}
.row:first-child{border-top:0}
.muted{color:#666;font-size:13px}
.empty{color:#777;font-style:italic;padding:8px 0}
button{font:inherit;border:0;border-radius:10px;padding:9px 12px;background:#0a84ff;color:#fff}
.secondary{background:#e9e9ed;color:#111}
.danger{background:#ff3b30}
.smallbtn{padding:7px 9px;font-size:13px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(255,255,255,.98);border-top:1px solid #ddd;padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:20}
.tabs button{flex:1;background:transparent;color:#555;padding:8px 3px;font-size:13px}
.tabs button.active{color:#0a84ff;font-weight:700}
input,select{width:100%;font:inherit;padding:11px;border:1px solid #ccc;border-radius:10px;background:#fff}
label{display:block;font-weight:600;margin:11px 0 5px}
dialog{border:0;border-radius:16px;padding:0;width:min(94vw,520px);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.35)}
form{padding:18px}
.actions{display:flex;gap:8px;margin-top:16px}
.actions button{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.chip{background:#f0f0f3;border-radius:999px;padding:6px 9px;font-size:13px}
.search{margin-bottom:12px}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px}
.section-title h2{margin:0;font-size:20px}
.segment{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.segment button{background:#e9e9ed;color:#111}
.segment button.active{background:#0a84ff;color:#fff}
.datebar{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:8px;margin-bottom:12px}
.datebar strong{text-align:center}
.pillrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.copygrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.summary-table{width:100%;border-collapse:collapse}
.summary-table th,.summary-table td{text-align:left;padding:9px 6px;border-top:1px solid #eee;font-size:14px}
.summary-table th{color:#555}
.toolbar2{display:flex;gap:8px;flex-wrap:wrap}
.notice{padding:10px;border-radius:10px;background:#f2f2f5;color:#444;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<header><h1 id="pageTitle">Food Log</h1></header>
<main id="app"></main>
<nav class="tabs">
<button data-tab="today" class="active">Today</button>
<button data-tab="history">History</button>
<button data-tab="foods">Foods</button>
<button data-tab="bugs">Bugs</button>
</nav>

<dialog id="foodDialog">
<form method="dialog" id="foodForm">
<h2 id="dialogTitle" style="margin-top:0">Add Food</h2>
<input type="hidden" id="editingId">
<label>Date</label><input id="entryDate" type="date">
<label>Meal</label><select id="meal"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select>
<label>Food</label><input id="foodName" list="foodList" autocomplete="off" required><datalist id="foodList"></datalist>
<label>Quantity</label><input id="quantity" value="1">
<label>Unit</label><select id="unit"><option>cup</option><option>tbsp</option><option>tsp</option><option>oz</option><option>lb</option><option>gram</option><option>slice</option><option>piece</option><option>serving</option><option>bowl</option><option>glass</option><option>small</option><option>medium</option><option>large</option></select>
<label>Category</label><select id="category"><option>Protein</option><option>Fruit / Vegetable</option><option>Carb / Starch</option><option>Dairy</option><option>Fat</option><option>Sugar / Sweets</option><option>Beverage</option><option>Other</option></select>
<div class="actions"><button type="button" id="cancelFood" class="secondary">Cancel</button><button id="saveFood">Save</button></div>
</form>
</dialog>



<dialog id="bugDialog">
<form method="dialog" id="bugForm">
<h2 style="margin-top:0">Report a Bug</h2>
<label>What happened?</label>
<textarea id="bugWhat" rows="4" required style="width:100%;font:inherit;padding:11px;border:1px solid #ccc;border-radius:10px;resize:vertical"></textarea>
<label>What were you trying to do?</label>
<textarea id="bugTrying" rows="3" style="width:100%;font:inherit;padding:11px;border:1px solid #ccc;border-radius:10px;resize:vertical"></textarea>
<label>What did you expect?</label>
<textarea id="bugExpected" rows="3" style="width:100%;font:inherit;padding:11px;border:1px solid #ccc;border-radius:10px;resize:vertical"></textarea>
<div class="notice">The report automatically includes the date/time, app version, current screen, and device/browser information. It stays on this device until you delete it.</div>
<div class="actions">
<button type="button" id="cancelBug" class="secondary">Cancel</button>
<button id="saveBug">Save Bug</button>
</div>
</form>
</dialog>

<dialog id="savedFoodDialog">
<form method="dialog" id="savedFoodForm">
<h2 id="savedFoodTitle" style="margin-top:0">Add Saved Food</h2>
<input type="hidden" id="originalSavedFoodName">
<label>Food name</label><input id="savedFoodName" autocomplete="off" required>
<label>Default quantity</label><input id="savedFoodQuantity" value="1">
<label>Default unit</label><select id="savedFoodUnit">
<option>cup</option><option>tbsp</option><option>tsp</option><option>oz</option><option>lb</option><option>gram</option>
<option>slice</option><option>piece</option><option>serving</option><option>bowl</option><option>glass</option>
<option>small</option><option>medium</option><option>large</option>
</select>
<label>Category</label><select id="savedFoodCategory">
<option>Protein</option><option>Fruit / Vegetable</option><option>Carb / Starch</option><option>Dairy</option>
<option>Fat</option><option>Sugar / Sweets</option><option>Beverage</option><option>Other</option>
</select>
<div class="actions">
<button type="button" id="deleteSavedFood" class="danger" style="display:none">Delete Food</button>
<button type="button" id="cancelSavedFood" class="secondary">Cancel</button>
<button id="saveSavedFood">Save Food</button>
</div>
</form>
</dialog>

<dialog id="copyDialog">
<form method="dialog">
<h2 style="margin-top:0" id="copyTitle">Copy Meal From</h2>
<label>Copy from date</label><input type="date" id="copySourceDate">
<div class="notice" id="copyNotice"></div>
<div class="actions"><button type="button" id="cancelCopy" class="secondary">Cancel</button><button id="confirmCopy">Copy</button></div>
</form>
</dialog>

function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function openDB(){
  db=await new Promise((res,rej)=>{
    const r=indexedDB.open(DBNAME,DBVER);
    r.onupgradeneeded=()=>{
      const d=r.result;
      if(!d.objectStoreNames.contains("entries")) d.createObjectStore("entries",{keyPath:"id"});
      if(!d.objectStoreNames.contains("foods")) d.createObjectStore("foods",{keyPath:"name"});
      if(!d.objectStoreNames.contains("bugReports")) d.createObjectStore("bugReports",{keyPath:"id"});
    };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
  const foods=await all("foods");
  if(!foods.length){
    const tx=db.transaction("foods","readwrite");
    const st=tx.objectStore("foods");
    CATALOG.forEach(f=>st.put(f));
    await new Promise(r=>tx.oncomplete=r);
  }
}
function store(n,m="readonly"){return db.transaction(n,m).objectStore(n)}
async function all(n){return req(store(n).getAll())}
async function put(n,o){return req(store(n,"readwrite").put(o))}
async function del(n,k){return req(store(n,"readwrite").delete(k))}

function localDay(d=new Date()){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function parseDay(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function startOfWeek(d){const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x}
function startOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1)}
function formatDate(d,opts={weekday:"short",month:"short",day:"numeric"}){return d.toLocaleDateString(undefined,opts)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function qtyNumber(s){
  s=String(s).trim();
  if(s.includes(" ")){
    const p=s.split(" "); return qtyNumber(p[0])+qtyNumber(p[1]);
  }
  if(s.includes("/")){const [a,b]=s.split("/").map(Number);return b?a/b:0}
  const n=Number(s); return Number.isFinite(n)?n:0;
}
function fmt(n){return Math.abs(n-Math.round(n))<0.0001?String(Math.round(n)):String(Math.round(n*100)/100)}
function normalizedQuantity(e){
  const q=qtyNumber(e.quantity), u=e.unit;
  if(["oz","lb","gram"].includes(u)){
    const oz=u==="oz"?q:u==="lb"?q*16:q/28.3495; return {amount:oz,unit:"oz"};
  }
  if(["cup","tbsp","tsp"].includes(u)){
    const cup=u==="cup"?q:u==="tbsp"?q/16:q/48; return {amount:cup,unit:"cup"};
  }
  return {amount:q,unit:u};
}

  else await renderBugs();
}

async function renderToday(){

    <div class="chips">${Object.keys(counts).sort().map(c=>`<span class="chip">${esc(c)}: ${counts[c]}</span>`).join("")}</div></section>`;
  const recent=[...entries].sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||"")).filter((e,i,a)=>a.findIndex(x=>x.foodName===e.foodName)===i).slice(0,5);

    h+=`<section class="card"><div class="section-title"><h2>${mealName}</h2><button class="secondary smallbtn addMeal" data-meal="${mealName}">Add</button></div>
    ${es.length?es.map(e=>entryRow(e,true)).join(""):'<div class="empty">No entries</div>'}</section>`;

  document.querySelectorAll(".addMeal").forEach(b=>b.onclick=()=>openFood({date:localDay(),meal:b.dataset.meal}));
  document.querySelectorAll(".recent").forEach(b=>b.onclick=()=>openFood({date:localDay(),foodName:b.dataset.food}));
  bindEntryButtons();
}

function entryRow(e,showEdit){

function bindEntryButtons(){

async function renderHistory(){
  let h=`<div class="segment">
    <button class="${historyMode==="day"?"active":""}" data-mode="day">Day</button>
    <button class="${historyMode==="week"?"active":""}" data-mode="week">Week</button>
    <button class="${historyMode==="month"?"active":""}" data-mode="month">Month</button>
  </div>
  <div class="datebar"><button class="secondary" id="prevDate">‹</button><strong id="historyLabel"></strong><button class="secondary" id="nextDate">›</button></div>
  <div id="historyBody"></div>`;
  app.innerHTML=h;
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{historyMode=b.dataset.mode;renderHistory()});
  prevDate.onclick=()=>{historyDate=shiftHistory(-1);renderHistory()};
  nextDate.onclick=()=>{historyDate=shiftHistory(1);renderHistory()};
  await renderHistoryBody();
}
function shiftHistory(dir){
  if(historyMode==="day") return addDays(historyDate,dir);
  if(historyMode==="week") return addDays(historyDate,dir*7);
  return new Date(historyDate.getFullYear(),historyDate.getMonth()+dir,1);
}
async function renderHistoryBody(){
  const entries=await all("entries");
  if(historyMode==="day"){
    const d=localDay(historyDate); historyLabel.textContent=formatDate(historyDate,{weekday:"short",month:"short",day:"numeric",year:"numeric"});
    const es=entries.filter(e=>e.date===d);
    let h=`<section class="card"><div class="section-title"><h2>${d===localDay()?"Today":"Entries"}</h2><button id="historyAdd">Add Food</button></div>`;
    for(const mealName of MEALS){
      const m=es.filter(e=>e.meal===mealName);
      h+=`<div style="margin-top:14px"><div class="section-title"><b>${mealName}</b><div class="toolbar2">
      <button class="secondary smallbtn repeatMeal" data-meal="${mealName}">Repeat Previous</button>
      <button class="secondary smallbtn copyMeal" data-meal="${mealName}">Copy From</button></div></div>
      ${m.length?m.map(e=>entryRow(e,true)).join(""):'<div class="empty">No entries</div>'}</div>`;
    }
    h+=`</section>`;
    historyBody.innerHTML=h;
    historyAdd.onclick=()=>openFood({date:d});
    bindEntryButtons();
    document.querySelectorAll(".repeatMeal").forEach(b=>b.onclick=()=>repeatPreviousMeal(d,b.dataset.meal));
    document.querySelectorAll(".copyMeal").forEach(b=>b.onclick=()=>openCopyDialog(d,b.dataset.meal));
  } else {
    let start,end,label;
    if(historyMode==="week"){
      start=startOfWeek(historyDate); end=addDays(start,6);
      label=`${formatDate(start,{month:"short",day:"numeric"})} - ${formatDate(end,{month:"short",day:"numeric",year:"numeric"})}`;
    } else {
      start=startOfMonth(historyDate); end=new Date(start.getFullYear(),start.getMonth()+1,0);
      label=formatDate(start,{month:"long",year:"numeric"});
    }
    historyLabel.textContent=label;
    const a=localDay(start), b=localDay(end);
    const es=entries.filter(e=>e.date>=a && e.date<=b);
    historyBody.innerHTML=summaryHistory(es);
    document.querySelectorAll("[data-summarymode]").forEach(btn=>btn.onclick=()=>{historySummaryMode=btn.dataset.summarymode;renderHistoryBody()});
  }
}
function summaryHistory(es){
  const modeButtons=`<div class="segment" style="grid-template-columns:1fr 1fr">
    <button class="${historySummaryMode==="quantity"?"active":""}" data-summarymode="quantity">Quantity</button>
    <button class="${historySummaryMode==="frequency"?"active":""}" data-summarymode="frequency">Frequency</button>
  </div>`;
  if(!es.length) return modeButtons+`<section class="card"><div class="empty">No entries in this period</div></section>`;
  if(historySummaryMode==="frequency"){
    const c={}; es.forEach(e=>c[e.foodName]=(c[e.foodName]||0)+1);
    const rows=Object.entries(c).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
    return modeButtons+`<section class="card"><table class="summary-table"><tr><th>Food</th><th>Times</th></tr>${rows.map(([n,v])=>`<tr><td>${esc(n)}</td><td>${v}</td></tr>`).join("")}</table></section>`;
  }
  const q={};
  es.forEach(e=>{const n=normalizedQuantity(e); const key=e.foodName+"|||"+n.unit; q[key]=(q[key]||0)+n.amount});
  const rows=Object.entries(q).map(([k,v])=>{const [name,unit]=k.split("|||");return {name,unit,value:v}}).sort((a,b)=>a.name.localeCompare(b.name)||a.unit.localeCompare(b.unit));
  return modeButtons+`<section class="card"><table class="summary-table"><tr><th>Food</th><th>Total</th></tr>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${fmt(r.value)} ${esc(r.unit)}</td></tr>`).join("")}</table></section>`;
}

async function repeatPreviousMeal(targetDate,mealName){
  const entries=await all("entries");
  const dates=[...new Set(entries.filter(e=>e.meal===mealName && e.date<targetDate).map(e=>e.date))].sort().reverse();
  if(!dates.length){alert("No previous "+mealName+" found.");return}
  const source=dates[0];
  const sourceEntries=entries.filter(e=>e.date===source && e.meal===mealName);
  const existing=entries.some(e=>e.date===targetDate && e.meal===mealName);
  if(existing && !confirm(mealName+" already has entries on this date. Add the previous meal anyway?")) return;
  await copyEntries(sourceEntries,targetDate);
  renderHistoryBody();
}
function openCopyDialog(targetDate,mealName){
  copyMealName={targetDate,mealName};
  copyTitle.textContent=mealName==="Snack"?"Copy Snacks From":"Copy "+mealName+" From";
  copySourceDate.value=localDay(addDays(parseDay(targetDate),-1));
  copySourceDate.max=localDay(addDays(parseDay(targetDate),-1));
  copyNotice.textContent="Choose an earlier date. The selected "+mealName.toLowerCase()+" entries will be added to "+targetDate+".";
  copyDialog.showModal();
}
confirmCopy.onclick=async e=>{
  e.preventDefault();
  if(!copyMealName) return;
  const src=copySourceDate.value;
  if(!src || src>=copyMealName.targetDate){alert("Choose a date before the target date.");return}
  const entries=await all("entries");
  const source=entries.filter(x=>x.date===src && x.meal===copyMealName.mealName);
  if(!source.length){alert("No "+copyMealName.mealName+" entries were found on that date.");return}
  const existing=entries.some(x=>x.date===copyMealName.targetDate && x.meal===copyMealName.mealName);
  if(existing && !confirm(copyMealName.mealName+" already has entries on the target date. Add the copied meal anyway?")) return;
  await copyEntries(source,copyMealName.targetDate);
  copyDialog.close(); copyMealName=null; await renderHistoryBody();
};
async function copyEntries(source,targetDate){
  for(const e of source){
    await put("entries",{...e,id:crypto.randomUUID(),date:targetDate,createdAt:new Date().toISOString()});
  }
}

        `Screen: ${r.screen}`,
        `What happened: ${r.what}`,
        `Trying to do: ${r.trying||""}`,
        `Expected: ${r.expected||""}`,
        `App version: ${r.appVersion}`,
        `Device/browser: ${r.userAgent}`
      ].join("\\n")).join("\\n\\n--------------------\\n\\n");

      try{
        await navigator.clipboard.writeText(out);
        alert("Bug reports copied. You can paste them into ChatGPT or an email.");
      }catch{
        alert("Could not copy automatically on this device.");

async function openFood(opts={}){
  editingId.value=opts.id||"";
  entryDate.value=opts.date||localDay();
  meal.value=opts.meal||"Breakfast";
  foodName.value=opts.foodName||"";
  const foods=await all("foods");
  foodList.innerHTML=foods.map(f=>`<option value="${esc(f.name)}"></option>`).join("");
  let f=null;
  if(opts.id){
    dialogTitle.textContent="Edit Food Entry";
    quantity.value=opts.quantity; unit.value=opts.unit; category.value=opts.category;
  } else {
    dialogTitle.textContent="Add Food";
    f=foods.find(x=>x.name===opts.foodName);
    quantity.value=f?f.quantity:"1"; unit.value=f?f.unit:"cup"; category.value=f?f.category:"Other";
  }
  foodDialog.showModal();
}
foodName.oninput=async e=>{
  const foods=await all("foods");
  const f=foods.find(x=>x.name.toLowerCase()===e.target.value.trim().toLowerCase());
  if(f){quantity.value=f.quantity;unit.value=f.unit;category.value=f.category}
};
cancelBug.onclick=()=>bugDialog.close();
saveBug.onclick=async e=>{
  e.preventDefault();
  const what=bugWhat.value.trim();
  if(!what) return;

  await put("bugReports",{
    id:crypto.randomUUID(),
    createdAt:new Date().toISOString(),
    screen:tab,
    what,
    trying:bugTrying.value.trim(),
    expected:bugExpected.value.trim(),
    appVersion:"2B + Bug Capture",
    userAgent:navigator.userAgent
  });

  bugDialog.close();
  if(tab==="bugs") await renderBugs();
};

cancelSavedFood.onclick=()=>savedFoodDialog.close();
deleteSavedFood.onclick=async ()=>{
  const original=originalSavedFoodName.value.trim();
  if(!original) return;
  if(!confirm('Delete "'+original+'" from your saved foods list?\n\nExisting meal history will not be deleted.')) return;

  await del("foods", original);
  savedFoodDialog.close();

  if(tab==="foods") await renderFoods();
};

saveSavedFood.onclick=async e=>{
  e.preventDefault();
  const name=savedFoodName.value.trim();
  if(!name) return;

  const original=originalSavedFoodName.value.trim();
  const foods=await all("foods");
  const collision=foods.find(f=>f.name.toLowerCase()===name.toLowerCase() && f.name!==original);
  if(collision){
    alert("A saved food with that name already exists.");
    return;
  }

  if(original && original!==name){
    await del("foods",original);
  }

  await put("foods",{
    name,
    quantity:savedFoodQuantity.value.trim()||"1",
    unit:savedFoodUnit.value,
    category:savedFoodCategory.value
  });

  savedFoodDialog.close();
  if(tab==="foods") await renderFoods();
};
cancelFood.onclick=()=>foodDialog.close();
cancelCopy.onclick=()=>{ copyMealName=null; copyDialog.close(); };
saveFood.onclick=async e=>{
  const n=foodName.value.trim();
  if(!n){e.preventDefault();return}
  const id=editingId.value||crypto.randomUUID();
  let createdAt=new Date().toISOString();
  if(editingId.value){
    const entries=await all("entries"); const old=entries.find(x=>x.id===id); if(old?.createdAt) createdAt=old.createdAt;
  }
  const obj={id,date:entryDate.value||localDay(),meal:meal.value,foodName:n,quantity:quantity.value.trim()||"1",unit:unit.value,category:category.value,createdAt};
  await put("entries",obj);
  const foods=await all("foods");
  if(!foods.some(f=>f.name.toLowerCase()===n.toLowerCase())) await put("foods",{name:n,quantity:obj.quantity,unit:obj.unit,category:obj.category});
  setTimeout(render,0);
};

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
openDB().then(render);
if("serviceWorker"in navigator) navigator.serviceWorker.register("service-worker.js");
</script>
